  #labels { position:fixed; inset:0; pointer-events:none; }
  .lbl { position:absolute; transform:translate(-50%,-100%); font:600 11px var(--f); color:var(--acc); background:rgba(8,14,20,.78); border:1px solid rgba(79,209,255,.5); border-radius:6px; padding:2px 6px; white-space:nowrap; }

const K = 1.6;                 // oyun alanı: oda 1,6 kat genişletildi, eşyalar gerçek boyutunda
const H = plan.height * 1.1;   // geniş odada tavan biraz yükseltildi
{
  // Düzeltme: RoomPlan pencere köşesindeki yüz yüze iki masayı tek masa (1,58×1,38) saymış.

  const i = plan.items.findIndex(t => t.cat === 'table' && Math.abs(t.w - 1.583) < 0.01);

    const t = plan.items[i];
    // Pencere önündeki yüz yüze iki masa (taramadan üstten ölçüldü). Doğudaki Erdinç'in: 3 monitör.
    plan.items.splice(i, 1, { ...t, x: 0.66, z: -1.49, w: 1.86, d: 0.68, yaw: Math.PI / 2, mon: 3, grp: 'pencere' },
